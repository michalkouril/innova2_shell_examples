# NTP server inline in FLD-lite: fld_rx -> ntp_resp (free-running, in-place reply) -> fld_tx; ntp_tod time base;
# ntp_ctl (host-started) sets the time base and the reply fields, reads the counters
[connectivity]
nk=fld_rx:1:fld_rx_1
nk=ntp_resp:1:ntp_resp_1
nk=ntp_tod:1:ntp_tod_1
nk=ntp_ctl:1:ntp_ctl_1
nk=fld_tx:1:fld_tx_1
nk=fld_reap:1:fld_reap_1
nk=e5_ticker2:1:e5_ticker2_1
sp=fld_rx_1.mem:bank0
sp=fld_rx_1.dbr:bank0
sp=fld_rx_1.res:bank0
sp=fld_rx_1.tlog:bank0
sp=fld_tx_1.sq:bank0
sp=fld_tx_1.buf:bank0
sp=fld_tx_1.bfw:peer
sp=fld_tx_1.res:bank0
sp=fld_tx_1.tlog:bank0
sp=fld_reap_1.cq:bank0
sp=fld_reap_1.res:bank0
sp=ntp_ctl_1.out:bank0
stream_connect=fld_rx_1.rxs:ntp_resp_1.in:64
stream_connect=ntp_resp_1.out:fld_tx_1.txs:64
stream_connect=fld_reap_1.cred:fld_tx_1.cred:64
stream_connect=ntp_resp_1.trq:ntp_tod_1.rq:16
stream_connect=ntp_tod_1.tk:ntp_resp_1.ttk:16
stream_connect=ntp_ctl_1.tcfg:ntp_tod_1.cfg:16
stream_connect=ntp_tod_1.snap:ntp_ctl_1.tsnap:16
stream_connect=ntp_ctl_1.rcfg:ntp_resp_1.rcfg:16
stream_connect=ntp_ctl_1.rrq:ntp_resp_1.rrq:16
stream_connect=ntp_resp_1.rcnt:ntp_ctl_1.rcnt:16
stream_connect=fld_rx_1.sreq:e5_ticker2_1.rq0
stream_connect=e5_ticker2_1.tk0:fld_rx_1.stick
stream_connect=fld_tx_1.sreq:e5_ticker2_1.rq1
stream_connect=e5_ticker2_1.tk1:fld_tx_1.stick
