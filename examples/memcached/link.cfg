# memcached on the UDP step-2 stack, fp7: FLD-lite -> udp_rx_lite -> mcd -> udp_tx_lite; mcd hash table + value store in bank0
[connectivity]
nk=fld_rx:1:fld_rx_1
nk=fld_tx:1:fld_tx_1
nk=fld_reap:1:fld_reap_1
nk=e5_ticker2:1:e5_ticker2_1
nk=udp_rx_lite:1:udp_rx_lite_1
nk=mcd:1:mcd_1
nk=udp_tx_lite:1:udp_tx_lite_1
sp=fld_rx_1.mem:bank0
sp=fld_rx_1.dbr:bank0
sp=fld_rx_1.res:bank0
sp=fld_rx_1.tlog:bank0
sp=fld_tx_1.sq:bank0
sp=fld_tx_1.buf:bank0
sp=fld_tx_1.bfw:peer
sp=fld_tx_1.res:bank0
sp=fld_tx_1.tlog:bank0
sp=fld_reap_1.cq:bank0
sp=fld_reap_1.res:bank0
nk=mcd_mem:1:mcd_mem_1
sp=mcd_mem_1.ht:bank0
sp=mcd_mem_1.vs:bank0
stream_connect=fld_rx_1.rxs:udp_rx_lite_1.in:64
stream_connect=udp_rx_lite_1.meta:mcd_1.rxm:16
stream_connect=udp_rx_lite_1.data:mcd_1.rxd:64
stream_connect=udp_rx_lite_1.learn:udp_tx_lite_1.learn:16
stream_connect=mcd_1.txm:udp_tx_lite_1.txm:16
stream_connect=mcd_1.txd:udp_tx_lite_1.txd:64
stream_connect=udp_tx_lite_1.out:fld_tx_1.txs:64
stream_connect=fld_reap_1.cred:fld_tx_1.cred:64
stream_connect=fld_rx_1.sreq:e5_ticker2_1.rq0
stream_connect=e5_ticker2_1.tk0:fld_rx_1.stick
stream_connect=fld_tx_1.sreq:e5_ticker2_1.rq1
stream_connect=e5_ticker2_1.tk1:fld_tx_1.stick
stream_connect=mcd_1.htRdCmdO:mcd_mem_1.htRdCmd:16
stream_connect=mcd_mem_1.htRdData:mcd_1.htRdData:32
stream_connect=mcd_1.htWrCmdO:mcd_mem_1.htWrCmd:16
stream_connect=mcd_1.htWrData:mcd_mem_1.htWrData:32
stream_connect=mcd_1.vsRdCmdO:mcd_mem_1.vsRdCmd:16
stream_connect=mcd_mem_1.vsRdData:mcd_1.vsRdData:32
stream_connect=mcd_1.vsWrCmdO:mcd_mem_1.vsWrCmd:16
stream_connect=mcd_1.vsWrData:mcd_mem_1.vsWrData:32
nk=mcd_dbg:1:mcd_dbg_1
sp=mcd_dbg_1.out:bank0
stream_connect=mcd_1.dbgO:mcd_dbg_1.a:16
stream_connect=mcd_mem_1.dbg:mcd_dbg_1.b:16
