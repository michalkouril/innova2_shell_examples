# iperf2 UDP server inline in FLD-lite: fld_rx -> iperf_srv (free-running, counts datagrams, answers the final one with
# the server report) -> fld_tx; iperf_tmr its cycle counter; iperf_sctl (host-started) sets the port, reads counters
[connectivity]
nk=fld_rx:1:fld_rx_1
nk=iperf_srv:1:iperf_srv_1
nk=iperf_tmr:1:iperf_tmr_1
nk=iperf_sctl:1:iperf_sctl_1
nk=fld_tx:1:fld_tx_1
nk=fld_reap:1:fld_reap_1
nk=e5_ticker2:1:e5_ticker2_1
sp=fld_rx_1.mem:bank0
sp=fld_rx_1.dbr:bank0
sp=fld_rx_1.res:bank0
sp=fld_rx_1.tlog:bank0
sp=fld_tx_1.sq:bank0
sp=fld_tx_1.buf:bank0
sp=fld_tx_1.bfw:peer
sp=fld_tx_1.res:bank0
sp=fld_tx_1.tlog:bank0
sp=fld_reap_1.cq:bank0
sp=fld_reap_1.res:bank0
sp=iperf_sctl_1.out:bank0
stream_connect=fld_rx_1.rxs:iperf_srv_1.in:64
stream_connect=iperf_srv_1.out:fld_tx_1.txs:64
stream_connect=fld_reap_1.cred:fld_tx_1.cred:64
stream_connect=iperf_srv_1.trq:iperf_tmr_1.rq:16
stream_connect=iperf_tmr_1.tk:iperf_srv_1.ttk:16
stream_connect=iperf_sctl_1.scfg:iperf_srv_1.scfg:16
stream_connect=iperf_sctl_1.srq:iperf_srv_1.srq:16
stream_connect=iperf_srv_1.scnt:iperf_sctl_1.scnt:16
stream_connect=fld_rx_1.sreq:e5_ticker2_1.rq0
stream_connect=e5_ticker2_1.tk0:fld_rx_1.stick
stream_connect=fld_tx_1.sreq:e5_ticker2_1.rq1
stream_connect=e5_ticker2_1.tk1:fld_tx_1.stick
